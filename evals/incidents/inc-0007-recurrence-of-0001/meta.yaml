# deterministic (mock-provider) end-to-end proof. To see it for real:
#   run --incident inc-0001-missing-env-var   (first, same Neo4j)
#   run --incident inc-0007-recurrence-of-0001
id: INC-0007
title: checkout pool exhaustion, second occurrence
