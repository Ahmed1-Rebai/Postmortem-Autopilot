name: Nightly Evaluation

on:
  schedule:
    - cron: "0 2 * * *"
  push:
    branches: [main]
  workflow_dispatch:

# The full, gate-enforced eval against the whole golden corpus. Every night
# and on every merge to main; manual runs via workflow_dispatch. Uses the real
# LLM provider (OpenRouter preferred, Anthropic fallback) when the repo has the
# matching API-key secret, otherwise falls back to the free mock provider.
# Results land in history.jsonl; the README table is regenerated and committed
# by github-actions[bot] (GITHUB_TOKEN commits don't re-trigger this workflow).

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    permissions:
      contents: write
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/ci-neo4j-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-neo4j-password 'RETURN 1'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Rebuild git fixtures
        run: |
          for d in evals/incidents/*/; do
            python "$d/build_repo.py"
          done

      - name: Run gated eval (real provider)
        if: ${{ env.OPENROUTER_API_KEY != '' || env.ANTHROPIC_API_KEY != '' }}
        env:
          LLM_PROVIDER: ${{ env.OPENROUTER_API_KEY != '' && 'openrouter' || 'anthropic' }}
          NEO4J_URI: bolt://localhost:7687
          NEO4J_PASSWORD: ci-neo4j-password
        run: python -m evals.runner --all --gate

      - name: Run gated eval (mock fallback)
        if: ${{ env.OPENROUTER_API_KEY == '' && env.ANTHROPIC_API_KEY == '' }}
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_PASSWORD: ci-neo4j-password
        run: python -m evals.runner --all --gate --mock

      - name: Regenerate README eval table
        run: python -m evals.update_readme

      - name: Commit eval trend data
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "evals: update trend data and README table"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
