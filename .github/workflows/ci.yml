name: CI

on:
  push:
    branches: [main]
  pull_request:

# Phase 0 scope: ruff + mypy + unit tests. Phase 3.3 extends this with the
# integration job (Neo4j service container), the mock eval suite, and the image
# build/push. Lint and types are here from day one so they never accumulate a
# backlog to "fix later".

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: ruff (lint)
        run: ruff check .

      - name: ruff (format)
        run: ruff format --check .

      - name: mypy
        run: mypy agent receiver evals

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # No API key, no containers — everything here must run under
      # LLM_PROVIDER=mock. See CLAUDE.md, "Testing expectations".
      - name: pytest tests/unit
        env:
          LLM_PROVIDER: mock
          NEO4J_PASSWORD: ci-not-a-real-password
        run: pytest tests/unit -q

  integration:
    # Real Neo4j + Valkey as service containers, not nested testcontainers:
    # the integration conftest connects to NEO4J_URI/VALKEY_URL when set and
    # falls back to testcontainers locally. Same images as docker-compose.yml.
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/ci-neo4j-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-neo4j-password 'RETURN 1'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: pytest tests/integration
        env:
          LLM_PROVIDER: mock
          NEO4J_URI: bolt://localhost:7687
          NEO4J_PASSWORD: ci-neo4j-password
          VALKEY_URL: redis://localhost:6379/0
        run: pytest tests/integration -q

  evals-quick:
    # docs/07's PR gate: the whole golden corpus under the mock provider.
    # `repo/` fixture dirs are gitignored, so CI rebuilds them first — the
    # eval would otherwise run against an empty working tree.
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/ci-neo4j-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-neo4j-password 'RETURN 1'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Rebuild git fixtures
        run: |
          for d in evals/incidents/*/; do
            python "$d/build_repo.py"
          done

      - name: Mock eval (gated)
        env:
          LLM_PROVIDER: mock
          NEO4J_URI: bolt://localhost:7687
          NEO4J_PASSWORD: ci-neo4j-password
        run: python -m evals.runner --all --mock --gate --no-write

  build:
    # Image build on every PR (validates the Dockerfiles); push to GHCR only
    # on main, where the k3s chart pulls them. See docs/05 and ADR-001.
    runs-on: ubuntu-latest
    needs: [lint-and-types, unit, integration, evals-quick]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Normalize GHCR owner
        id: ghcr
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pipeline image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ steps.ghcr.outputs.owner }}/postmortem-autopilot:dev
            ghcr.io/${{ steps.ghcr.outputs.owner }}/postmortem-autopilot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push receiver image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: receiver/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ steps.ghcr.outputs.owner }}/postmortem-receiver:dev
            ghcr.io/${{ steps.ghcr.outputs.owner }}/postmortem-receiver:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
