# Ephemeral Jobs have nowhere to be scraped from — Pushgateway is the
# well-known fix, and per-incident grouping keys (agent/observability/
# metrics.py's `push_metrics`) are what make a snapshot from one Job not get
# clobbered by the next. No persistence: Pushgateway holds pushed metrics in
# memory only, which is fine here — a restart just means Prometheus sees a
# gap until the next few runs push again, not data loss anyone depends on.
apiVersion: v1
kind: Service
metadata:
  name: pushgateway
  namespace: {{ .Values.namespace }}
spec:
  selector: {app: pushgateway}
  ports:
    - {port: 9091, targetPort: 9091}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: pushgateway}
  template:
    metadata:
      labels: {app: pushgateway}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: pushgateway
          image: {{ .Values.pushgateway.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          ports:
            - {containerPort: 9091}
          resources: {{- toYaml .Values.pushgateway.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /-/ready, port: 9091}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /-/healthy, port: 9091}
            initialDelaySeconds: 10
            periodSeconds: 15
