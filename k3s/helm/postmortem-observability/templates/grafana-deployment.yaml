# Official Grafana image runs as uid 472 ("grafana") by default, unlike
# Neo4j/Valkey's images (checkpoint 1's capability finding) — full hardening
# applies cleanly here. /var/lib/grafana (its sqlite state) and /tmp both
# need to be writable under readOnlyRootFilesystem, so both are emptyDir.
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: {{ .Values.namespace }}
spec:
  selector: {app: grafana}
  ports:
    - {port: 3000, targetPort: 3000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana
          image: {{ .Values.grafana.image | quote }}
          env:
            - {name: GF_SECURITY_ADMIN_USER, value: "admin"}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: grafana-secrets, key: admin-password}
            - {name: GF_PATHS_PROVISIONING, value: "/etc/grafana/provisioning"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          ports:
            - {containerPort: 3000}
          resources: {{- toYaml .Values.grafana.resources | nindent 12 }}
          volumeMounts:
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
            - {name: dashboards, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true}
            - {name: data, mountPath: /var/lib/grafana}
            - {name: tmp, mountPath: /tmp}
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: 3000}
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: datasources
          configMap: {name: grafana-datasources}
        - name: dashboards
          configMap: {name: grafana-dashboards}
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  admin-password: {{ .Values.grafana.adminPassword | quote }}
