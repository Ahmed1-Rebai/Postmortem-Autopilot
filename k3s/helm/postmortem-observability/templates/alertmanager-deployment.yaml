apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: {{ .Values.namespace }}
spec:
  selector: {app: alertmanager}
  ports:
    - {port: 9093, targetPort: 9093}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: alertmanager}
  template:
    metadata:
      labels: {app: alertmanager}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: alertmanager
          image: {{ .Values.alertmanager.image | quote }}
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          ports:
            - {containerPort: 9093}
          resources: {{- toYaml .Values.alertmanager.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/alertmanager/alertmanager.yml, subPath: alertmanager.yml, readOnly: true}
            - {name: secrets, mountPath: /etc/alertmanager/secrets, readOnly: true}
            - {name: data, mountPath: /alertmanager}
          readinessProbe:
            httpGet: {path: /-/ready, port: 9093}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /-/healthy, port: 9093}
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: config
          configMap: {name: alertmanager-config}
        - name: secrets
          secret: {secretName: alertmanager-secrets}
        - name: data
          emptyDir: {}
