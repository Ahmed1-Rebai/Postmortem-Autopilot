# The webhook secret as a file, not inlined into alertmanager.yml's
# ConfigMap — Alertmanager's http_config supports `bearer_token_file` for
# exactly this reason, matching the project's existing convention of secrets
# living in a Secret object with secretKeyRef, never inline in a ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  webhook-secret: {{ .Values.alertmanager.webhookSecret | quote }}
