# The "2. CronJob" trigger path (docs/05): unlike job-template.yaml's
# suspended CronJob, this one actually runs on its schedule. It finishes
# postmortems for incidents that started a run (wrote events to the graph)
# but never reached one — see `Neo4jMemory.find_incidents_needing_postmortem`
# for exactly what that catches and what it doesn't (an incident whose
# webhook was missed outright never gets an Incident node in the first
# place, so this sweep can't find it — a stated, not hidden, limitation).
#
# Same pod spec shape as job-template.yaml's Job (same image, security
# context, Neo4j/Valkey connectivity) — `sweep` needs no incident directory
# or ConfigMap mount, since it resumes from graph state alone.
{{- $usePromptsConfigMap := or .Values.pipeline.prompts.analyst .Values.pipeline.prompts.writer .Values.pipeline.prompts.repair }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postmortem-sweep
  namespace: {{ .Values.namespace.app }}
spec:
  schedule: {{ .Values.pipeline.sweep.schedule | quote }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.pipeline.backoffLimit }}
      ttlSecondsAfterFinished: {{ .Values.pipeline.ttlSecondsAfterFinished }}
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: sweep
              image: "{{ .Values.pipeline.image.repository }}:{{ .Values.pipeline.image.tag }}"
              imagePullPolicy: {{ .Values.pipeline.image.pullPolicy }}
              args: ["sweep", "--hours", {{ .Values.pipeline.sweep.hours | quote }}]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              env:
                - {name: LLM_PROVIDER, value: {{ .Values.pipeline.llm.provider | quote }}}
                - {name: ANALYST_MODEL, value: {{ .Values.pipeline.llm.analystModel | quote }}}
                - {name: WRITER_MODEL, value: {{ .Values.pipeline.llm.writerModel | quote }}}
                - name: NEO4J_URI
                  value: "bolt://neo4j.{{ .Values.namespace.data }}.svc.cluster.local:7687"
                - {name: NEO4J_USER, value: "neo4j"}
                - name: NEO4J_PASSWORD
                  valueFrom:
                    secretKeyRef: {name: postmortem-secrets, key: neo4j-password}
                {{- if .Values.secrets.anthropicApiKey }}
                - name: ANTHROPIC_API_KEY
                  valueFrom:
                    secretKeyRef: {name: postmortem-secrets, key: anthropic-api-key}
                {{- end }}
                {{- if .Values.secrets.openrouterApiKey }}
                - name: OPENROUTER_API_KEY
                  valueFrom:
                    secretKeyRef: {name: postmortem-secrets, key: openrouter-api-key}
                {{- end }}
                - {name: CITATION_COVERAGE_THRESHOLD, value: {{ .Values.pipeline.citationCoverageThreshold | quote }}}
                - {name: MAX_VALIDATION_RETRIES, value: {{ .Values.pipeline.maxValidationRetries | quote }}}
                - {name: CAUSAL_WINDOW_MINUTES, value: {{ .Values.pipeline.causalWindowMinutes | quote }}}
                {{- if .Values.pipeline.pushgatewayUrl }}
                - {name: PUSHGATEWAY_URL, value: {{ .Values.pipeline.pushgatewayUrl | quote }}}
                {{- end }}
                - {name: HOME, value: "/scratch"}
                - {name: OUTPUT_DIR, value: "/scratch/out"}
                {{- if $usePromptsConfigMap }}
                - {name: PROMPTS_DIR, value: "/config/prompts"}
                {{- end }}
              volumeMounts:
                - {name: scratch, mountPath: /scratch}
                {{- if $usePromptsConfigMap }}
                - {name: prompts, mountPath: /config/prompts, readOnly: true}
                {{- end }}
              resources: {{- toYaml .Values.pipeline.resources | nindent 16 }}
          volumes:
            - {name: scratch, emptyDir: {}}
            {{- if $usePromptsConfigMap }}
            - name: prompts
              configMap: {name: postmortem-prompts}
            {{- end }}
