# Traefik (k3s's built-in ingress controller) routes /hooks to the receiver
# (docs/05's topology diagram). /grafana is checkpoint 3's concern (a
# separate observability chart) and isn't added here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: postmortem
  namespace: {{ .Values.namespace.app }}
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /hooks
            pathType: Prefix
            backend:
              service:
                name: webhook-receiver
                port: {number: 8000}
