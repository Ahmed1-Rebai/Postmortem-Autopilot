# The "1. Manual" trigger path (docs/05): a suspended CronJob whose
# jobTemplate is the canonical pod spec.
#   kubectl create job --from=cronjob/postmortem-manual inc-check -n postmortem
# is k8s's own mechanism for stamping a real Job from it — no custom code.
#
# This is deliberately NOT what the webhook receiver (Phase 2 checkpoint 2)
# uses at request time: nothing running in a pod can re-render Helm templates
# from a chart it has no access to. The receiver builds a Job object directly
# via the Kubernetes API, sharing only the image/resource *values* with this
# template as a convention, not a mechanism (see docs/05-k3s-deployment.md
# and the TODO.md Phase 2 note on this).
{{- $usePromptsConfigMap := or .Values.pipeline.prompts.analyst .Values.pipeline.prompts.writer .Values.pipeline.prompts.repair }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postmortem-manual
  namespace: {{ .Values.namespace.app }}
spec:
  schedule: "0 3 * * *"
  suspend: true
  # A miscounted retry is bounded a second way: the pipeline's own retry loop
  # is capped at maxValidationRetries, and this caps the Job's own restart
  # attempts on top of that.
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.pipeline.backoffLimit }}
      ttlSecondsAfterFinished: {{ .Values.pipeline.ttlSecondsAfterFinished }}
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: pipeline
              image: "{{ .Values.pipeline.image.repository }}:{{ .Values.pipeline.image.tag }}"
              imagePullPolicy: {{ .Values.pipeline.image.pullPolicy }}
              args: ["run", "--incident", {{ .Values.pipeline.manualIncident | quote }}]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              env:
                - {name: LLM_PROVIDER, value: {{ .Values.pipeline.llm.provider | quote }}}
                - {name: ANALYST_MODEL, value: {{ .Values.pipeline.llm.analystModel | quote }}}
                - {name: WRITER_MODEL, value: {{ .Values.pipeline.llm.writerModel | quote }}}
                - name: NEO4J_URI
                  value: "bolt://neo4j.{{ .Values.namespace.data }}.svc.cluster.local:7687"
                - {name: NEO4J_USER, value: "neo4j"}
                - name: NEO4J_PASSWORD
                  valueFrom:
                    secretKeyRef: {name: postmortem-secrets, key: neo4j-password}
                {{- if .Values.secrets.anthropicApiKey }}
                - name: ANTHROPIC_API_KEY
                  valueFrom:
                    secretKeyRef: {name: postmortem-secrets, key: anthropic-api-key}
                {{- end }}
                {{- if .Values.secrets.openrouterApiKey }}
                - name: OPENROUTER_API_KEY
                  valueFrom:
                    secretKeyRef: {name: postmortem-secrets, key: openrouter-api-key}
                {{- end }}
                - {name: CITATION_COVERAGE_THRESHOLD, value: {{ .Values.pipeline.citationCoverageThreshold | quote }}}
                - {name: MAX_VALIDATION_RETRIES, value: {{ .Values.pipeline.maxValidationRetries | quote }}}
                - {name: CAUSAL_WINDOW_MINUTES, value: {{ .Values.pipeline.causalWindowMinutes | quote }}}
                # HOME and OUTPUT_DIR both land on the scratch volume: readOnlyRootFilesystem
                # means / is not writable, and git (GitCollector) plus the
                # report/document writers both need somewhere to write.
                - {name: HOME, value: "/scratch"}
                - {name: OUTPUT_DIR, value: "/scratch/out"}
                {{- if $usePromptsConfigMap }}
                - {name: PROMPTS_DIR, value: "/config/prompts"}
                {{- end }}
              volumeMounts:
                - {name: scratch, mountPath: /scratch}
                {{- if $usePromptsConfigMap }}
                - {name: prompts, mountPath: /config/prompts, readOnly: true}
                {{- end }}
              resources: {{- toYaml .Values.pipeline.resources | nindent 16 }}
          volumes:
            - {name: scratch, emptyDir: {}}
            {{- if $usePromptsConfigMap }}
            - name: prompts
              configMap: {name: postmortem-prompts}
            {{- end }}
