# Persistence off on purpose (mirrors docker-compose.yml): it's a cache, and
# restarting it must be a non-event.
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: {{ .Values.namespace.data }}
spec:
  selector: {app: valkey}
  ports:
    - {port: 6379, targetPort: 6379}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: {{ .Values.namespace.data }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: valkey}
  template:
    metadata:
      labels: {app: valkey}
    spec:
      # Checkpoint 1 assumed this needed the same exception as Neo4j's
      # StatefulSet ("the official image starts as uid 0, same finding") —
      # untested, written by analogy. Checkpoint 4 actually tested it
      # (`docker run --user 999:999 --cap-drop=ALL --read-only`) and it
      # starts cleanly: unlike Neo4j, this project runs Valkey with
      # persistence disabled (`--save "" --appendonly no`, no mounted
      # volume at all), so the chown-a-mounted-volume dance that forces
      # Neo4j's entrypoint to start as root never applies here. Full
      # hardening, same profile as the pipeline's own container.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: valkey
          image: {{ .Values.valkey.image | quote }}
          command: ["valkey-server", "--save", "", "--appendonly", "no"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          ports:
            - {containerPort: 6379}
          resources: {{- toYaml .Values.valkey.resources | nindent 12 }}
          readinessProbe:
            exec: {command: ["valkey-cli", "ping"]}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["valkey-cli", "ping"]}
            initialDelaySeconds: 10
            periodSeconds: 15
