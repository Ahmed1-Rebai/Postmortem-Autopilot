# NEO4J_PASSWORD and the LLM key, mounted as env — never baked into the image
# or a chart default (docs/05 Security notes). Values come from --set at
# install time; the committed defaults are the local-only placeholder that
# matches docker-compose.yml, nothing a real deployment would reuse.
apiVersion: v1
kind: Secret
metadata:
  name: postmortem-secrets
  namespace: {{ .Values.namespace.app }}
type: Opaque
stringData:
  neo4j-password: {{ .Values.neo4j.password | quote }}
  webhook-secret: {{ .Values.secrets.webhookSecret | quote }}
  {{- if .Values.secrets.anthropicApiKey }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.openrouterApiKey }}
  openrouter-api-key: {{ .Values.secrets.openrouterApiKey | quote }}
  {{- end }}
---
# Neo4j's own container reads NEO4J_AUTH directly (docker-compose.yml's
# `neo4j/${NEO4J_PASSWORD}` shape) — a second key so neo4j-statefulset.yaml
# doesn't have to string-concatenate inside a template.
apiVersion: v1
kind: Secret
metadata:
  name: postmortem-secrets
  namespace: {{ .Values.namespace.data }}
type: Opaque
stringData:
  neo4j-password: {{ .Values.neo4j.password | quote }}
  neo4j-auth: {{ printf "neo4j/%s" .Values.neo4j.password | quote }}
