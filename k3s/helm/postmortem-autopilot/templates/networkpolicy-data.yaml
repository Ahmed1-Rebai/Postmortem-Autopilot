# A NetworkPolicy that selects a pod and lists ingress rules is *itself*
# the default-deny — no separate "deny all" object needed, since once any
# policy selects a pod for a direction, only its explicitly listed traffic
# is allowed. This selects every pod in postmortem-data (podSelector: {})
# and allows ingress only from the postmortem namespace (the pipeline Jobs
# — manual, receiver-created, and sweep-recovered — plus the backup
# CronJob, which runs in postmortem-data itself and reaches Neo4j only
# through the Kubernetes API — `kubectl scale` — never over bolt, so it
# isn't a namespace this policy needs to admit). k3s 1.30 labels every
# namespace with the automatic `kubernetes.io/metadata.name` label, so no
# extra namespace-labeling step is needed for the selector below to match.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-postmortem
  namespace: {{ .Values.namespace.data }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespace.app }}
      ports:
        - {protocol: TCP, port: 7687}
        - {protocol: TCP, port: 6379}
